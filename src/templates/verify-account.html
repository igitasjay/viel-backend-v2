<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 500px;
        margin: 30px auto;
        background: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #333333;
      }
      .otp {
        font-size: 24px;
        font-weight: bold;
        color: #007bff;
        letter-spacing: 4px;
        margin: 20px 0;
      }
      .footer {
        font-size: 12px;
        color: #888888;
        margin-top: 30px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>🔑 Verify Your Email</h2>
      <p>Hello $name,</p>
      <p>Please use the OTP below to verify your email address:</p>
      <div class="otp">$otp</div>
      <p>This OTP will expire in 5 minutes.</p>
      <div class="footer">&copy; $year $appName. All rights reserved.</div>
    </div>
  </body>
</html>
