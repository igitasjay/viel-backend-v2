<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketing Update</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 30px auto;
        background: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }
      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        padding: 30px 20px;
        text-align: center;
      }
      .header h2 {
        margin: 0;
        font-size: 28px;
      }
      .content {
        padding: 30px 20px;
      }
      .message-box {
        background: #f8f9fa;
        padding: 20px;
        margin: 20px 0;
        border-radius: 8px;
        border-left: 4px solid #667eea;
      }
      .cta-button {
        display: inline-block;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        padding: 14px 32px;
        text-decoration: none;
        border-radius: 25px;
        margin: 20px 0;
        font-weight: bold;
        text-align: center;
      }
      .footer {
        font-size: 12px;
        color: #888888;
        margin-top: 30px;
        text-align: center;
        border-top: 1px solid #eeeeee;
        padding: 20px;
      }
      .unsubscribe {
        font-size: 11px;
        color: #999999;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>$title</h2>
      </div>
      <div class="content">
        <p>Hello $name,</p>
        <div class="message-box">
          <p>$message</p>
        </div>
        <p>Thank you for being a valued member of the $appName community!</p>
        <div class="footer">
          <p>Have questions? Contact us at $supportEmail</p>
          <p class="unsubscribe">
            You're receiving this email because you're a registered user of
            $appName
          </p>
          &copy; $year $appName. All rights reserved.
        </div>
      </div>
    </div>
  </body>
</html>
