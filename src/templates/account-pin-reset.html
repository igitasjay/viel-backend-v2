<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your PIN</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 500px;
        margin: 30px auto;
        background: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #333333;
        margin-top: 0;
      }
      p {
        color: #555555;
        line-height: 1.6;
      }
      .otp {
        font-size: 24px;
        font-weight: bold;
        color: #007bff;
        letter-spacing: 4px;
        margin: 20px 0;
        text-align: center;
        padding: 10px;
        background: #f0f8ff;
        border-radius: 6px;
        display: inline-block;
      }
      .footer {
        font-size: 12px;
        color: #888888;
        margin-top: 30px;
        text-align: center;
        border-top: 1px solid #eee;
        padding-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>$title</h2>
      <p>Hello $name,</p>
      <p>$message</p>
      <div class="otp">$otp</div>
      <p>This code will expire in 5 minutes for security reasons.</p>
      <div class="footer">&copy; $year YourApp. All rights reserved.</div>
    </div>
  </body>
</html>
